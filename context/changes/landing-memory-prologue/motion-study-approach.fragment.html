<div id="kit-memory-approach">
  <style>
    #kit-memory-approach { width:100%; }
    #kit-memory-approach .motion-preview { position:relative; width:100%; height:610px; overflow:hidden; background:#f6f2e8; color:#29251f; font-family:Arial,Helvetica,sans-serif; isolation:isolate; }
    #kit-memory-approach .preview-header { position:absolute; z-index:20; top:0; left:0; right:0; height:60px; padding:0 27px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #29251f20; background:#f6f2e8; }
    #kit-memory-approach .preview-brand { font-size:21px; font-weight:700; letter-spacing:-1.2px; }
    #kit-memory-approach .preview-brand span { color:#a63f29; }
    #kit-memory-approach .preview-signin { font-size:12px; padding:7px 13px; border:1px solid #29251f60; border-radius:3px; }
    #kit-memory-approach .notes { position:absolute; inset:60px 0 0; z-index:1; }
    #kit-memory-approach .memory-bit { position:absolute; width:112px; min-height:76px; padding:12px 13px; box-sizing:border-box; background:var(--note-fill); box-shadow:1px 3px 8px #29251f0b; transform-origin:center; pointer-events:none; }
    #kit-memory-approach .memory-bit strong { display:block; font-size:14px; line-height:1.25; font-weight:400; font-family:Georgia,serif; }
    #kit-memory-approach .memory-bit small { display:block; margin-bottom:8px; font-size:10px; line-height:1.2; color:#625a4e; }
    #kit-memory-approach .memory-bit.background-note strong { font-size:11px; }
    #kit-memory-approach .memory-bit.background-note small { font-size:11px; }
    #kit-memory-approach .memory-bit.featured { width:134px; min-height:91px; }
    #kit-memory-approach .memory-bit.featured strong { font-size:18px; }
    #kit-memory-approach .copy-well { position:absolute; width:min(490px,92%); height:230px; top:78px; left:50%; transform:translateX(-50%); z-index:6; border-radius:50%; background:radial-gradient(ellipse at center,rgba(246,242,232,1) 0%,rgba(246,242,232,.99) 43%,rgba(246,242,232,.82) 64%,rgba(246,242,232,.3) 83%,rgba(246,242,232,0) 100%); filter:blur(12px); pointer-events:none; }
    #kit-memory-approach .opening-copy, #kit-memory-approach .resolved-copy { position:absolute; z-index:8; top:96px; left:15%; width:70%; text-align:center; pointer-events:none; }
    #kit-memory-approach .opening-copy h2, #kit-memory-approach .resolved-copy h2 { margin:0; font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:53px; line-height:1.02; letter-spacing:-2.6px; color:#29251f; text-shadow:0 0 9px #f6f2e8,0 1px 3px #f6f2e8; }
    #kit-memory-approach .opening-copy p { margin:13px 0 0; font-size:13px; line-height:1.5; }
    #kit-memory-approach .resolved-copy h2 em { color:#a63f29; font-weight:400; }
    #kit-memory-approach .mock-cta { position:absolute; z-index:9; left:50%; top:246px; transform:translateX(-50%); display:block; padding:11px 17px; background:#a63f29; color:#f6f2e8; border-radius:3px; font-size:12px; white-space:nowrap; }
    #kit-memory-approach .camera-space { position:absolute; inset:0; z-index:4; perspective:900px; perspective-origin:50% 55%; transform-style:preserve-3d; pointer-events:none; }
    #kit-memory-approach .depth-art, #kit-memory-approach .depth-layer { position:absolute; display:block; max-width:none; height:auto; transform-origin:center; backface-visibility:hidden; will-change:transform; }
    #kit-memory-approach .study-label { margin-top:calc(var(--font-size-base) * .5); }
    #kit-memory-approach .study-controls { margin-top:calc(var(--font-size-base) * 1); display:flex; gap:calc(var(--font-size-base) * 1); align-items:center; }
    #kit-memory-approach .scrub-field { flex:1; min-width:0; }
    #kit-memory-approach .scrub-label { display:flex; justify-content:space-between; gap:12px; margin-bottom:calc(var(--font-size-base) * .25); }
    #kit-memory-approach .phase-label { margin-top:calc(var(--font-size-base) * .5); min-height:1.5em; }
    @media(max-width:560px) {
      #kit-memory-approach .motion-preview { height:590px; }
      #kit-memory-approach .preview-header { padding:0 16px; }
      #kit-memory-approach .preview-brand { font-size:19px; }
      #kit-memory-approach .preview-signin { font-size:11px; }
      #kit-memory-approach .opening-copy, #kit-memory-approach .resolved-copy { left:8%; width:84%; top:112px; }
      #kit-memory-approach .opening-copy h2, #kit-memory-approach .resolved-copy h2 { font-size:36px; letter-spacing:-1.8px; }
      #kit-memory-approach .opening-copy p { font-size:12px; }
      #kit-memory-approach .copy-well { left:50%; width:94%; top:94px; height:210px; filter:blur(10px); }
      #kit-memory-approach .memory-bit { width:89px; padding:10px; min-height:64px; }
      #kit-memory-approach .memory-bit.featured { width:106px; min-height:82px; }
      #kit-memory-approach .memory-bit.featured strong { font-size:14px; }
      #kit-memory-approach .memory-bit small { font-size:11px; }
      #kit-memory-approach .mock-cta { top:226px; font-size:11px; padding:10px 14px; }
    }
  </style>

      const notes = [

      ];
      const fills = ["#eedb96", "#dcd3e7", "#dce1cf", "#e6b7a1", "#eee5cc"];
      const elements = notes.map(function (note,index) {
        const element = document.createElement("div");
        element.className = "memory-bit " + (index < 6 ? "featured" : "background-note");
        const label = document.createElement("small"); label.textContent = note[0];

      function clamp(value) { return Math.max(0,Math.min(1,value)); }
      function smooth(start,end,value) { const t = clamp((value-start)/(end-start)); return t*t*(3-2*t); }
      function save() {
        if (window.openai && window.openai.setWidgetState) window.openai.setWidgetState({modelContent:{revision:"camera-approach-v4",progress:progress,departure:state.departure,survivors:state.survivors,cameraZoom:state.cameraZoom},privateContent:{revision:"camera-approach-v4",progress:progress,departure:state.departure,survivors:state.survivors,cameraZoom:state.cameraZoom}}).catch(function () {});
      }
      function render(value) {
        progress = clamp(value);
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        const narrow = width < 560;
        const loss = smooth(.06,.7,progress);
        const pullback = clamp((progress-.04)/.78);
        const title = smooth(.66,.86,progress);
        const artWidth = Math.min(430,width * (narrow ? 1.02 : .73));
        const artHeight = artWidth * 2 / 3;
        const x = (width-artWidth)/2;
        const y = height-artHeight-20;
        const closeScale = narrow ? 1+(state.cameraZoom-1)*.55 : state.cameraZoom;
        const scale = 1+(closeScale-1)*(1-pullback);
        stage.dataset.departure=state.departure;
        stage.dataset.cameraScale=scale.toFixed(3);
        camera.style.perspectiveOrigin="50% "+(narrow?"65%":"55%");

        art.style.height=artHeight+"px";
        art.style.left=x+"px";
        art.style.top=y+"px";
        art.style.transform="scale("+scale+")";
        art.style.zIndex="2";
        const blend=smooth(.88,.98,progress);
        art.style.opacity=String(blend);
        const entries=[
          [man,-1,0,pullback,0],
          [woman,1,0,pullback,1],
          [table,0,1,pullback,3]
        ];
        entries.forEach(function(entry){
          const element=entry[0], horizontal=entry[1], vertical=entry[2], arrival=entry[3], layer=entry[4];
          const dx=horizontal*((width+artWidth*closeScale)/2+60)*(1-arrival);
          const dy=vertical*(height-y+artHeight*(closeScale-1)/2+60)*(1-arrival);
          element.style.width=artWidth+"px";element.style.height=artHeight+"px";

        });

        opening.style.transform="translateY(" + (-smooth(.28,.44,progress)*18) + "px)";

        well.style.opacity=String(1-smooth(.32,.64,progress));
        resolved.style.transform="translateY(" + ((1-title)*14) + "px)";
        const fieldHeight=field.clientHeight;
        const featuredPositions=[[14,39],[79,24],[3,63],[79,54],[37,69],[69,82]];
        const extraPositions=[[38,56],[51,48],[48,82],[32,43]];
        const finalPositions=[[.04,.32],[.79,.33],[.025,.72],[.8,.74],[.16,.85],[.7,.86]];
        elements.forEach(function (item) {
          const keep = item.index < state.survivors;
          const column=item.index%6;
          const row=Math.floor(item.index/6);
          const px=item.index<6?featuredPositions[item.index][0]:item.index>=30?extraPositions[item.index-30][0]:column*17+((item.index*19)%13)-5;
          const py=item.index<6?featuredPositions[item.index][1]:item.index>=30?extraPositions[item.index-30][1]:row*19+((item.index*7)%15)-9;
          const baseX=width*px/100;
          const baseY=fieldHeight*py/100;

          const dx = keep ? (finalX-baseX)*loss : loss * drift * direction * item.depth;
          const dy = keep ? (finalY-baseY)*loss : loss * (baseY < fieldHeight/2 ? -1 : 1) * drift * .7;
          const opacity = keep ? 1 - loss * (narrow ? .38 : .16) : (1-loss) * (item.index < 6 ? 1 : .82);

          const blur = state.departure === "Blur and drift" && !keep ? baseBlur+loss*5 : baseBlur;
          const sheetWidth=keep?cardW+(finalW-cardW)*loss:cardW;
          item.element.style.width=sheetWidth+"px";
          item.element.style.minHeight=(keep?cardH*(1-loss)+92*loss:cardH)+"px";
          item.element.style.left=baseX+"px";
          item.element.style.top=baseY+"px";
          item.element.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(item.angle*(1-loss*.35))+"deg) scale("+(1-loss*(keep?0:.12))+")";
          item.element.style.opacity=String(opacity);
          item.element.style.filter="blur("+blur+"px)";
          item.element.style.zIndex=String(item.index<6?8-item.index:1);
        });
        output.value=Math.round(progress*100)+"%";
        slider.value=String(Math.round(progress*100));
        const phaseText=progress<.16?"A field of memories":progress<.35?"Close to the conversation":progress<.84?"The camera pulls back; the scene comes into view":"The full conversation; a few details remain";
        if(phaseText!==priorPhase){phase.textContent=phaseText;priorPhase=phaseText;}
      }
      function stop() { if(frame)cancelAnimationFrame(frame); frame=0;playing=false;play.textContent="Play sequence"; }
      slider.addEventListener("input",function(){stop();render(Number(slider.value)/100);});
      slider.addEventListener("change",save);
      play.addEventListener("click",function(){
        if(playing){stop();save();return;}
        if(reduce.matches){render(1);save();return;}
        const start=performance.now();playing=true;play.textContent="Pause";render(0);
        function tick(now){render((now-start)/6500);if(progress<1){frame=requestAnimationFrame(tick);}else{stop();save();}}
        frame=requestAnimationFrame(tick);
      });
      new ResizeObserver(function(){render(progress);}).observe(stage);
      reduce.addEventListener("change",function(){if(reduce.matches){stop();render(1);}});
      window.addEventListener("openai:set_globals",function(event){
        const snapshot=event.detail&&event.detail.globals&&event.detail.globals.widgetState;
        const restored=snapshot&&(snapshot.privateContent||snapshot.modelContent||snapshot);
        if(!restored||restored.revision!=="camera-approach-v4")return;
        stop();
        if(["Blur and drift","Drift away","Soft dissolve"].includes(restored.departure))state.departure=restored.departure;
        if(Number.isFinite(restored.survivors))state.survivors=Math.max(0,Math.min(6,restored.survivors));
        if(Number.isFinite(restored.cameraZoom))state.cameraZoom=Math.max(2,Math.min(4.5,restored.cameraZoom));
        render(reduce.matches?1:Number.isFinite(restored.progress)?restored.progress:progress);
      });
      render(progress);
      if(globalThis.Tweak){
        const tweak=new Tweak({container:stage,onChange:function(){render(progress);}});
        tweak.addSelect(state,"departure",{label:"How details recede",options:["Blur and drift","Drift away","Soft dissolve"]});
        tweak.addSlider(state,"survivors",{label:"Notes that remain",min:0,max:6,step:1});
        tweak.addSlider(state,"cameraZoom",{label:"Close-up scale",min:2,max:4.5,step:.1,unit:"×"});
      }
    })();
  </script>
</div>
