<div id="kit-memory-depth">
  <style>
    #kit-memory-depth { width:100%; }
    #kit-memory-depth .motion-preview { position:relative; width:100%; height:610px; overflow:hidden; background:#f6f2e8; color:#29251f; font-family:Arial,Helvetica,sans-serif; isolation:isolate; }
    #kit-memory-depth .preview-header { position:absolute; z-index:20; top:0; left:0; right:0; height:60px; padding:0 27px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #29251f20; background:#f6f2e8; }
    #kit-memory-depth .preview-brand { font-size:21px; font-weight:700; letter-spacing:-1.2px; }
    #kit-memory-depth .preview-brand span { color:#a63f29; }
    #kit-memory-depth .preview-signin { font-size:12px; padding:7px 13px; border:1px solid #29251f60; border-radius:3px; }
    #kit-memory-depth .notes { position:absolute; inset:60px 0 0; z-index:1; }
    #kit-memory-depth .memory-bit { position:absolute; width:112px; min-height:76px; padding:12px 13px; box-sizing:border-box; background:var(--note-fill); box-shadow:1px 3px 8px #29251f0b; transform-origin:center; pointer-events:none; }
    #kit-memory-depth .memory-bit strong { display:block; font-size:14px; line-height:1.25; font-weight:400; font-family:Georgia,serif; }
    #kit-memory-depth .memory-bit small { display:block; margin-bottom:8px; font-size:10px; line-height:1.2; color:#625a4e; }
    #kit-memory-depth .memory-bit.background-note strong { font-size:11px; }
    #kit-memory-depth .memory-bit.background-note small { font-size:11px; }
    #kit-memory-depth .memory-bit.featured { width:134px; min-height:91px; }
    #kit-memory-depth .memory-bit.featured strong { font-size:18px; }
    #kit-memory-depth .copy-well { position:absolute; width:min(490px,92%); height:230px; top:78px; left:50%; transform:translateX(-50%); z-index:6; border-radius:50%; background:radial-gradient(ellipse at center,rgba(246,242,232,1) 0%,rgba(246,242,232,.99) 43%,rgba(246,242,232,.82) 64%,rgba(246,242,232,.3) 83%,rgba(246,242,232,0) 100%); filter:blur(12px); pointer-events:none; }
    #kit-memory-depth .opening-copy, #kit-memory-depth .resolved-copy { position:absolute; z-index:8; top:96px; left:15%; width:70%; text-align:center; pointer-events:none; }
    #kit-memory-depth .opening-copy h2, #kit-memory-depth .resolved-copy h2 { margin:0; font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:53px; line-height:1.02; letter-spacing:-2.6px; color:#29251f; text-shadow:0 0 9px #f6f2e8,0 1px 3px #f6f2e8; }
    #kit-memory-depth .opening-copy p { margin:13px 0 0; font-size:13px; line-height:1.5; }
    #kit-memory-depth .resolved-copy h2 em { color:#a63f29; font-weight:400; }
    #kit-memory-depth .mock-cta { position:absolute; z-index:9; left:50%; top:246px; transform:translateX(-50%); display:block; padding:11px 17px; background:#a63f29; color:#f6f2e8; border-radius:3px; font-size:12px; white-space:nowrap; }
    #kit-memory-depth .camera-space { position:absolute; inset:0; z-index:4; perspective:900px; perspective-origin:50% 55%; transform-style:preserve-3d; pointer-events:none; }
    #kit-memory-depth .depth-art { position:absolute; display:block; max-width:none; height:auto; transform-origin:center; backface-visibility:hidden; will-change:transform; }
    #kit-memory-depth .study-label { margin-top:calc(var(--font-size-base) * .5); }
    #kit-memory-depth .study-controls { margin-top:calc(var(--font-size-base) * 1); display:flex; gap:calc(var(--font-size-base) * 1); align-items:center; }
    #kit-memory-depth .scrub-field { flex:1; min-width:0; }
    #kit-memory-depth .scrub-label { display:flex; justify-content:space-between; gap:12px; margin-bottom:calc(var(--font-size-base) * .25); }
    #kit-memory-depth .phase-label { margin-top:calc(var(--font-size-base) * .5); min-height:1.5em; }
    @media(max-width:560px) {
      #kit-memory-depth .motion-preview { height:590px; }
      #kit-memory-depth .preview-header { padding:0 16px; }
      #kit-memory-depth .preview-brand { font-size:19px; }
      #kit-memory-depth .preview-signin { font-size:11px; }
      #kit-memory-depth .opening-copy, #kit-memory-depth .resolved-copy { left:8%; width:84%; top:112px; }
      #kit-memory-depth .opening-copy h2, #kit-memory-depth .resolved-copy h2 { font-size:36px; letter-spacing:-1.8px; }
      #kit-memory-depth .opening-copy p { font-size:12px; }
      #kit-memory-depth .copy-well { left:50%; width:94%; top:94px; height:210px; filter:blur(10px); }
      #kit-memory-depth .memory-bit { width:89px; padding:10px; min-height:64px; }
      #kit-memory-depth .memory-bit.featured { width:106px; min-height:82px; }
      #kit-memory-depth .memory-bit.featured strong { font-size:14px; }
      #kit-memory-depth .memory-bit small { font-size:11px; }
      #kit-memory-depth .mock-cta { top:226px; font-size:11px; padding:10px 14px; }
    }
  </style>

        ["next coffee", "Ask about the painting class."],
        ["something he said", "A train trip in the spring."],
        ["last conversation", "Trying to grow tomatoes."],
        ["a birthday idea", "She loves second-hand books."],
        ["one little note", "The climbing course starts soon."],
        ["next time", "Ask about the new team."],
        ["small detail", "The dog hates the rain."],
        ["over coffee", "A new recipe for Sunday."],
        ["a little plan", "Learning to play the piano."],
        ["a thing to ask", "How was the first rehearsal?"],
        ["after lunch", "His sister is visiting soon."],
        ["remember", "They found a quiet beach."],
        ["last week", "A small woodworking project."],
        ["for next time", "Ask about the tomato plants."],
        ["a familiar detail", "Always the window seat."],
        ["something to keep", "That story about the train."],
        ["another little thing", "A very ambitious jigsaw."],
        ["when you reconnect", "The first day at the new job."],
        ["worth remembering", "Coffee after the morning walk."]
      ];
      const fills = ["#eedb96", "#dcd3e7", "#dce1cf", "#e6b7a1", "#eee5cc"];
      const elements = notes.map(function (note,index) {
        const element = document.createElement("div");
        element.className = "memory-bit " + (index < 6 ? "featured" : "background-note");
        const label = document.createElement("small"); label.textContent = note[0];
        const text = document.createElement("strong"); text.textContent = note[1];
        element.append(label,text);
        element.style.setProperty("--note-fill", fills[index % fills.length]);
        field.appendChild(element);
        return {element:element,angle:((index * 23) % 25) - 12,depth:0.65 + (index % 5) * .16,index:index};
      });
      function clamp(value) { return Math.max(0,Math.min(1,value)); }
      function smooth(start,end,value) { const t = clamp((value-start)/(end-start)); return t*t*(3-2*t); }
      function save() {
        if (window.openai && window.openai.setWidgetState) window.openai.setWidgetState({modelContent:{revision:"camera-pullback-v2",progress:progress,departure:state.departure,survivors:state.survivors,cameraZoom:state.cameraZoom},privateContent:{revision:"camera-pullback-v2",progress:progress,departure:state.departure,survivors:state.survivors,cameraZoom:state.cameraZoom}}).catch(function () {});
      }
      function render(value) {
        progress = clamp(value);
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        const narrow = width < 560;
        const loss = smooth(.06,.7,progress);
        const pullback = smooth(.18,.87,progress);
        const title = smooth(.66,.86,progress);
        const artWidth = Math.min(430,width * (narrow ? 1.02 : .73));
        const artHeight = artWidth * 2 / 3;
        const x = (width-artWidth)/2;
        const y = height-artHeight-20;
        const closeScale = narrow ? 1+(state.cameraZoom-1)*.55 : state.cameraZoom;
        const scale = 1+(closeScale-1)*(1-pullback);
        const z = 900*(1-1/scale);
        stage.dataset.departure=state.departure;
        stage.dataset.cameraScale=scale.toFixed(3);
        camera.style.perspectiveOrigin="50% "+(narrow?"65%":"55%");
        art.style.width=artWidth+"px";
        art.style.height=artHeight+"px";
        art.style.left=x+"px";
        art.style.top=y+"px";
        art.style.transform="translate3d(0,0,"+z+"px)";
        art.style.opacity=String(smooth(.12,.29,progress));
        opening.style.opacity=String(1-smooth(.28,.44,progress));
        opening.style.transform="translateY(" + (-smooth(.28,.44,progress)*18) + "px)";
        resolved.style.opacity=String(title);
        well.style.opacity=String(1-smooth(.32,.64,progress));
        resolved.style.transform="translateY(" + ((1-title)*14) + "px)";
        const columns=narrow?5:6;
        const rows=30/columns;
        const fieldHeight=field.clientHeight;
        const cellW=width/columns;
        const cellH=fieldHeight/rows;
        const cardW=cellW*(narrow?1.5:1.38)+4;
        const cardH=cellH*1.32+8;
        const featuredSlots=narrow?[0,4,25,29,10,19]:[0,5,24,29,12,17];
        const otherSlots=Array.from({length:30},function(_,i){return i;}).filter(function(i){return !featuredSlots.includes(i);});
        const finalPositions=[[.04,.32],[.79,.33],[.025,.72],[.8,.74],[.16,.85],[.7,.86]];
        elements.forEach(function (item) {
          const keep = item.index < state.survivors;
          const slot=item.index<6?featuredSlots[item.index]:otherSlots[item.index-6];
          const column=slot%columns;
          const row=Math.floor(slot/columns);
          const baseX=column*cellW-(cardW-cellW)/2+(((item.index*7)%11)-5)*1.2;
          const baseY=row*cellH-(cardH-cellH)/2+(((item.index*11)%9)-4)*1.2;
          const direction = baseX < width/2 ? -1 : 1;
          const drift = state.departure === "Soft dissolve" ? 12 : (narrow ? 75 : 145);
          const finalW=narrow?104:138;
          const finalX=keep?Math.min(width-finalW-8,Math.max(8,width*finalPositions[item.index][0])):baseX;
          const finalY=keep?fieldHeight*finalPositions[item.index][1]:baseY;
          const dx = keep ? (finalX-baseX)*loss : loss * drift * direction * item.depth;
          const dy = keep ? (finalY-baseY)*loss : loss * (baseY < fieldHeight/2 ? -1 : 1) * drift * .7;
          const opacity = keep ? 1 - loss * (narrow ? .38 : .16) : (1-loss) * (item.index < 6 ? 1 : .82);
          const baseBlur = item.index < 6 ? 0 : item.index % 3 === 0 ? 1 : .2;
          const blur = state.departure === "Blur and drift" && !keep ? baseBlur+loss*5 : baseBlur;
          const sheetWidth=keep?cardW+(finalW-cardW)*loss:cardW;
          item.element.style.width=sheetWidth+"px";
          item.element.style.minHeight=(keep?cardH*(1-loss)+92*loss:cardH)+"px";
          item.element.style.left=baseX+"px";
          item.element.style.top=baseY+"px";
          item.element.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(item.angle*(1-loss*.35))+"deg) scale("+(1-loss*(keep?0:.12))+")";
          item.element.style.opacity=String(opacity);
          item.element.style.filter="blur("+blur+"px)";
          item.element.style.zIndex=String(item.index<6?8-item.index:1);
        });
        output.value=Math.round(progress*100)+"%";
        slider.value=String(Math.round(progress*100));
        const phaseText=progress<.16?"A field of memories":progress<.35?"Close to the conversation":progress<.84?"The camera pulls back; the scene comes into view":"The full conversation; a few details remain";
        if(phaseText!==priorPhase){phase.textContent=phaseText;priorPhase=phaseText;}
      }
      function stop() { if(frame)cancelAnimationFrame(frame); frame=0;playing=false;play.textContent="Play sequence"; }
      slider.addEventListener("input",function(){stop();render(Number(slider.value)/100);});
      slider.addEventListener("change",save);
      play.addEventListener("click",function(){
        if(playing){stop();save();return;}
        if(reduce.matches){render(1);save();return;}
        const start=performance.now();playing=true;play.textContent="Pause";render(0);
        function tick(now){render((now-start)/6500);if(progress<1){frame=requestAnimationFrame(tick);}else{stop();save();}}
        frame=requestAnimationFrame(tick);
      });
      new ResizeObserver(function(){render(progress);}).observe(stage);
      reduce.addEventListener("change",function(){if(reduce.matches){stop();render(1);}});
      window.addEventListener("openai:set_globals",function(event){
        const snapshot=event.detail&&event.detail.globals&&event.detail.globals.widgetState;
        const restored=snapshot&&(snapshot.privateContent||snapshot.modelContent||snapshot);
        if(!restored||restored.revision!=="camera-pullback-v2")return;
        stop();
        if(["Blur and drift","Drift away","Soft dissolve"].includes(restored.departure))state.departure=restored.departure;
        if(Number.isFinite(restored.survivors))state.survivors=Math.max(0,Math.min(6,restored.survivors));
        if(Number.isFinite(restored.cameraZoom))state.cameraZoom=Math.max(2,Math.min(4.5,restored.cameraZoom));
        render(reduce.matches?1:Number.isFinite(restored.progress)?restored.progress:progress);
      });
      render(progress);
      if(globalThis.Tweak){
        const tweak=new Tweak({container:stage,onChange:function(){render(progress);}});
        tweak.addSelect(state,"departure",{label:"How details recede",options:["Blur and drift","Drift away","Soft dissolve"]});
        tweak.addSlider(state,"survivors",{label:"Notes that remain",min:0,max:6,step:1});
        tweak.addSlider(state,"cameraZoom",{label:"Close-up scale",min:2,max:4.5,step:.1,unit:"×"});
      }
    })();
  </script>
